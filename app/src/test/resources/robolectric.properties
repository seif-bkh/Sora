# Robolectric has no Android SDK jar for API 36 yet (compileSdk/targetSdk are
# 36), so it fails at startup with:
#   IllegalArgumentException at DefaultSdkPicker.java:119
# Pin the emulated SDK to the newest level Robolectric ships. This affects the
# JVM test runtime only - it does not change what the app compiles or targets.
sdk=34
