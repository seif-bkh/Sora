# ---------------------------------------------------------------------------
# Sora — Gradle build configuration
# ---------------------------------------------------------------------------

# 4g heap: the module graph is wide (13 modules) and Compose + KSP + Apollo
# codegen are memory-hungry. Matches the CI runner allocation in ci.yml.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel + caching: a multi-module build is the whole reason these exist.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# AndroidX is mandatory for Compose/Hilt/Room.
android.useAndroidX=true

# Non-transitive R classes keep each module's R limited to its own resources,
# which cuts build time and prevents accidental cross-module resource use.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
