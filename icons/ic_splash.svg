<?xml version="1.0" encoding="utf-8"?>
<!--
  Sora — Splash-Screen Icon
  ─────────────────────────
  Canvas:        108×108dp  (same size as adaptive-icon layers)
  Visible:       ~160dp within the 288dp SplashScreen window
  Difference:    Simplified — watermark removed, strokes slightly bolder,
                 frame and kanji only.  Looks crisp at both splash and
                 launcher scale.

  Usage (values-v31):
    <item name="android:windowSplashScreenAnimatedIcon">
      @drawable/ic_splash
    </item>
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5BA3D0"/>
      <stop offset="55%"  stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#2C5AA0" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Sky fill -->
  <clipPath id="safe">
    <rect x="16" y="16" width="76" height="76" rx="18"/>
  </clipPath>
  <rect x="16" y="16" width="76" height="76" fill="url(#sky)" clip-path="url(#safe)"/>

  <!-- Horizon line — slightly bolder for splash -->
  <line x1="18" y1="63" x2="90" y2="63"
        stroke="#FFFFFF"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- Floating frame — slightly bolder stroke -->
  <rect x="30" y="30" width="48" height="27" rx="2"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <!-- 空 signature -->
  <text x="80" y="83"
        text-anchor="middle"
        font-family="'Noto Serif JP', serif"
        font-weight="400"
        font-size="10"
        fill="#FFFFFF"
        opacity="0.55"
        letter-spacing="0.5">空</text>

</svg>
