# ---------------------------------------------------------------------------
# Sora — Gradle version catalog
#
# Single source of truth for every dependency version. Modules reference
# aliases (libs.xxx) and never hardcode a version string.
#
# Version choices are pinned deliberately:
#   * AGP 8.13 is the final 8.x line: supports compileSdk 36, requires
#     Gradle 8.13 and JDK 17. AGP 9.x is avoided for now - this project can
#     only be compiled via CI, so a major-version migration is expensive to
#     debug one round-trip at a time. Revisit post-MVP.
#   * Kotlin 2.x uses the separate Compose Compiler Gradle plugin, which is
#     versioned in lockstep with Kotlin itself.
#   * KSP versions are Kotlin-coupled: <kotlin>-<ksp> must match the Kotlin
#     version exactly or the build fails at configuration time.
# ---------------------------------------------------------------------------

[versions]
# --- Build tooling -------------------------------------------------------
agp = "8.13.0"
# Kotlin MUST match the version embedded in the Gradle distribution (8.13
# embeds Kotlin 2.0.21). The `kotlin-dsl` plugin compiles build-logic with
# Gradle's embedded compiler, which cannot read metadata produced by a newer
# Kotlin - so a newer Kotlin here fails the build at build-logic compile time.
# Bumping Kotlin therefore requires bumping Gradle in lockstep.
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"         # must track `kotlin` exactly
hilt = "2.52"

# --- SDK levels ----------------------------------------------------------
# minSdk 26 per the project brief; target/compile 36 (Android 16), the Play
# requirement from 31 Aug 2026.
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# --- AndroidX core -------------------------------------------------------
androidxCore = "1.15.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
androidxSplashscreen = "1.0.1"

# --- Compose -------------------------------------------------------------
# The BOM governs all androidx.compose:* artifact versions.
# Compose BOM chosen for Kotlin 2.0.21 compatibility; the Compose compiler
# plugin is versioned with Kotlin itself.
composeBom = "2024.12.01"
androidxNavigation = "2.8.5"
# Material3 adaptive drives the WindowSizeClass-based layouts required by the
# brief (bottom nav on compact, nav rail on medium/expanded).
androidxAdaptive = "1.0.0"
androidxWindow = "1.3.0"

# --- Persistence ---------------------------------------------------------
# Room 2.7+ targets the Kotlin 2.0 language version, which matches our Kotlin
# 2.0.21. It also requires KSP2.
room = "2.7.2"
androidxDataStore = "1.1.1"
# Proto DataStore: protoc generates the schema classes, protobuf-javalite is
# the runtime. The Gradle plugin must be >= 0.9.5 - earlier versions break
# Gradle's configuration cache, which we have enabled.
protobuf = "4.28.3"
protobufPlugin = "0.9.5"
# Tink encrypts the auth-token DataStore. Used directly rather than via
# androidx.security:security-crypto (deprecated April 2025) or
# androidx.datastore:datastore-tink (alpha only) - see DECISIONS.md.
tink = "1.15.0"

# --- Async ---------------------------------------------------------------
kotlinxCoroutines = "1.9.0"

# --- Testing -------------------------------------------------------------
junit4 = "4.13.2"
robolectric = "4.14.1"
turbine = "1.2.0"
androidxTestExt = "1.2.1"
androidxTestCore = "1.6.1"
androidxEspresso = "3.6.1"

[libraries]
# --- AndroidX core -------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }

# --- Compose -------------------------------------------------------------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
androidx-compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
androidx-window = { module = "androidx.window:window", version.ref = "androidxWindow" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }

# --- Persistence ---------------------------------------------------------
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "androidxDataStore" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# --- Async ---------------------------------------------------------------
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# --- DI ------------------------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# --- Testing -------------------------------------------------------------
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }

# Referenced so the version catalog can expose AGP/KSP to the build-logic
# convention plugins as regular dependencies.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Required from Kotlin 2.0 onward: the Compose compiler ships as its own
# plugin rather than a composeOptions block.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }

# --- Sora convention plugins (defined in build-logic/) -------------------
sora-android-application = { id = "sora.android.application" }
sora-android-library = { id = "sora.android.library" }
sora-android-library-compose = { id = "sora.android.library.compose" }
sora-android-feature = { id = "sora.android.feature" }
sora-android-hilt = { id = "sora.android.hilt" }
sora-jvm-library = { id = "sora.jvm.library" }
sora-android-room = { id = "sora.android.room" }
