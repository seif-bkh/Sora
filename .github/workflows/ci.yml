# ---------------------------------------------------------------------------
# Sora — CI workflow  (REVISION 2)
#
# MANUAL INSTALL REQUIRED (AGENTS.md §1):
#   Replace .github/workflows/ci.yml with this file and commit it.
#   Agents are not permitted to create/modify files under .github/workflows/.
#
# WHAT CHANGED FROM REVISION 1 AND WHY
#   The agent's sandbox cannot reach GitHub's log storage (Azure blob /
#   results-receiver hosts are blocked), so when a Gradle step fails the agent
#   can see *that* it failed but not *why*. Every job now tees Gradle output to
#   a file and, on failure, re-emits the tail as a GitHub **error annotation**
#   plus a **job summary** — both readable through api.github.com, which the
#   sandbox can reach. Without this, each build fix is guesswork costing a
#   full CI round-trip.
#
#   Also: actions/setup-java bumped v4 -> v5 (v4 is deprecated and warns on
#   every run).
#
# Optional repo secret:
#   ANILIST_CLIENT_ID — AniList API client id. If unset, CI injects a
#   placeholder so the build still compiles (no secrets in source).
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  build:
    name: Assemble (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Inject local.properties
        run: |
          echo "anilist.clientId=${ANILIST_CLIENT_ID:-0}" >> local.properties
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      - name: Assemble debug
        id: assemble
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-assemble.log

      # Makes the failure readable through the API (annotations + job summary).
      - name: Surface failure
        if: failure()
        run: |
          LOG=/tmp/gradle-assemble.log
          {
            echo "## Assemble (debug) failed"
            echo ""
            echo '```'
            tail -n 150 "$LOG" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotation body: newlines must be URL-encoded as %0A.
          MSG=$(grep -E "^(e: |> |FAILURE|Caused by|\* What went wrong|\* Where)" "$LOG" 2>/dev/null | tail -n 40)
          [ -z "$MSG" ] && MSG=$(tail -n 40 "$LOG" 2>/dev/null)
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/''}"
          echo "::error title=Assemble failed::${MSG}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Inject local.properties
        run: |
          echo "anilist.clientId=${ANILIST_CLIENT_ID:-0}" >> local.properties
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      # Covers every module's JVM unit tests, including the high-risk
      # filename-parser and fuzzy-matcher suites.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle-test.log

      - name: Surface failure
        if: failure()
        run: |
          LOG=/tmp/gradle-test.log
          {
            echo "## Unit tests failed"
            echo ""
            echo '```'
            tail -n 150 "$LOG" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(grep -E "^(e: |> |FAILURE|Caused by|\* What went wrong|\* Where)" "$LOG" 2>/dev/null | tail -n 40)
          [ -z "$MSG" ] && MSG=$(tail -n 40 "$LOG" 2>/dev/null)
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/''}"
          echo "::error title=Unit tests failed::${MSG}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            /tmp/gradle-test.log
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Inject local.properties
        run: |
          echo "anilist.clientId=${ANILIST_CLIENT_ID:-0}" >> local.properties
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      - name: Run lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee /tmp/gradle-lint.log

      - name: Surface failure
        if: failure()
        run: |
          LOG=/tmp/gradle-lint.log
          {
            echo "## Lint failed"
            echo ""
            echo '```'
            tail -n 150 "$LOG" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(grep -E "^(e: |> |FAILURE|Caused by|\* What went wrong|\* Where)" "$LOG" 2>/dev/null | tail -n 40)
          [ -z "$MSG" ] && MSG=$(tail -n 40 "$LOG" 2>/dev/null)
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/''}"
          echo "::error title=Lint failed::${MSG}"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            /tmp/gradle-lint.log
          if-no-files-found: warn
          retention-days: 7

