# ---------------------------------------------------------------------------
# Sora — CI workflow
#
# MANUAL INSTALL REQUIRED (AGENTS.md §1):
#   Copy this file to .github/workflows/ci.yml yourself and commit it.
#   Agents are not permitted to create/modify files under .github/workflows/.
#
# Optional repo secret:
#   ANILIST_CLIENT_ID — AniList API client id. If unset, CI injects a
#   placeholder so the build still compiles (no secrets in source, see brief).
#
# NOTE: this workflow assumes the Phase 1 Gradle skeleton exists (gradlew,
# settings.gradle.kts, the module list from the brief). Until Phase 1 lands it
# will fail fast on "gradlew not found" — that is expected. Whenever the module
# list or test/lint targets change, I'll hand you an updated version of this
# file to replace manually (AGENTS.md §1.5).
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  build:
    name: Assemble (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Inject local.properties
        run: |
          echo "anilist.clientId=${ANILIST_CLIENT_ID:-0}" >> local.properties
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Inject local.properties
        run: |
          echo "anilist.clientId=${ANILIST_CLIENT_ID:-0}" >> local.properties
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      # Covers every module's JVM unit tests, including the high-risk
      # filename-parser and fuzzy-matcher suites (brief: "Non-Functional
      # Requirements"). The benchmark module has no JVM unit tests and is
      # excluded automatically because it exposes no testDebugUnitTest task.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Inject local.properties
        run: |
          echo "anilist.clientId=${ANILIST_CLIENT_ID:-0}" >> local.properties
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 7

  # Enabled in Phase 7, when the benchmark module and Baseline Profiles land.
  # Macrobenchmark needs a real/emulated device, so it runs on the reactive
  # emulator runner rather than the plain ubuntu build image. I'll hand you the
  # updated ci.yml with this job uncommented at that point.
