<?xml version="1.0" encoding="utf-8"?>
<!--
  Sora — Play Store Listing Icon
  ─────────────────────────────
  Size:          512×512px
  Transparency:  NONE — Play Store requires an opaque PNG.
                 Export this SVG as PNG with no alpha channel.
  Composition:   Full-bleed sky gradient + white frame / horizon / kanji.
                 Identical design to the launcher mark, just upscaled.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5BA3D0"/>
      <stop offset="55%"  stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#2C5AA0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed gradient background (no transparency) -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Faint 空 watermark in upper sky -->
  <text x="256" y="240"
        text-anchor="middle"
        font-family="'Noto Serif JP', serif"
        font-weight="300"
        font-size="180"
        fill="#FFFFFF"
        opacity="0.08"
        letter-spacing="4">空</text>

  <!-- Horizon line — golden-ratio division (~62%) -->
  <line x1="76" y1="305" x2="436" y2="305"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- Floating 16:9 frame — the "window" -->
  <rect x="142" y="150" width="228" height="128" rx="9"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"/>

  <!-- 空 signature — lower-right -->
  <text x="420" y="430"
        text-anchor="middle"
        font-family="'Noto Serif JP', serif"
        font-weight="400"
        font-size="47"
        fill="#FFFFFF"
        opacity="0.55"
        letter-spacing="2">空</text>

</svg>
